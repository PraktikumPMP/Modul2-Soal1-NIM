name: Autograding Tests

on:
  - push
  - repository_dispatch

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # N=3 -> 9 petak, jarak 8 = 6+2, tanpa tangga/naga
      - name: Case 01 - Papan 3x3 tanpa tangga & naga (jawab 2)
        id: case-01
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 01 - Papan 3x3 tanpa tangga & naga (jawab 2)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            3
            0
            0
          expected-output: |
            2
          comparison-method: exact
          timeout: 2
          max-score: 5

      # N=0 -> target 0, langsung 0
      - name: Case 02 - Edge case N = 0 (jawab 0)
        id: case-02
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 02 - Edge case N = 0 (jawab 0)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            0
          expected-output: |
            0
          comparison-method: exact
          timeout: 2
          max-score: 5

      # N=1 -> sudah di petak akhir, langsung 0
      - name: Case 03 - Edge case N = 1 (jawab 0)
        id: case-03
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 03 - Edge case N = 1 (jawab 0)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            1
          expected-output: |
            0
          comparison-method: exact
          timeout: 2
          max-score: 5

      # N=2 -> 4 petak, jarak 3 -> cukup 1 langkah
      - name: Case 04 - Papan 2x2, sekali lempar dadu (jawab 1)
        id: case-04
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 04 - Papan 2x2, sekali lempar dadu (jawab 1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            2
            0
            0
          expected-output: |
            1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # N=5 -> 25 petak, jarak 24 = 4 x 6
      - name: Case 05 - Papan 5x5 tanpa tangga & naga (jawab 4)
        id: case-05
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 05 - Papan 5x5 tanpa tangga & naga (jawab 4)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            5
            0
            0
          expected-output: |
            4
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga 2->25: lempar 1, naik tangga ke petak 25
      - name: Case 06 - Tangga langsung ke petak akhir (jawab 1)
        id: case-06
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 06 - Tangga langsung ke petak akhir (jawab 1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            5
            1
            2 25
            0
          expected-output: |
            1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga 2->20, 21->60, 61->100: dipakai bergantian tiap langkah
      - name: Case 07 - Tangga berantai di papan 10x10 (jawab 3)
        id: case-07
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 07 - Tangga berantai di papan 10x10 (jawab 3)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            10
            3
            2 20
            21 60
            61 100
            0
          expected-output: |
            3
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Petak 2-7 semuanya naga ke petak 1, petak 16 mustahil dicapai
      - name: Case 08 - Naga memblokir semua jalan (jawab -1)
        id: case-08
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 08 - Naga memblokir semua jalan (jawab -1)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            4
            0
            6
            2 1
            3 1
            4 1
            5 1
            6 1
            7 1
          expected-output: |
            -1
          comparison-method: exact
          timeout: 2
          max-score: 5

      # Tangga 1->16 hanya aktif saat mendarat, bukan saat start; jarak 15 -> 3 langkah
      - name: Case 09 - Tangga di petak 1 tidak berpengaruh (jawab 3)
        id: case-09
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 09 - Tangga di petak 1 tidak berpengaruh (jawab 3)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            4
            1
            1 16
            0
          expected-output: |
            3
          comparison-method: exact
          timeout: 2
          max-score: 5

      # 8 tangga + 0 naga di papan 10x10; BFS harus pilih jalur terpendek
      - name: Case 10 - Papan 10x10 dengan tangga dan naga campuran (jawab 14)
        id: case-10
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 10 - Papan 10x10 dengan tangga dan naga campuran (jawab 14)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            10
            8
            3 22
            5 8
            11 26
            20 29
            27 1
            21 9
            17 4
            19 7
            0
          expected-output: |
            14
          comparison-method: exact
          timeout: 2
          max-score: 5

      # 3 tangga + 4 naga, jalur tangga 2->15, 10->30, 25->35 lalu ke 36
      - name: Case 11 - Papan 6x6 campuran tangga & naga (jawab 3)
        id: case-11
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 11 - Papan 6x6 campuran tangga & naga (jawab 3)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            6
            3
            2 15
            10 30
            25 35
            4
            14 3
            29 4
            33 9
            34 5
          expected-output: |
            3
          comparison-method: exact
          timeout: 2
          max-score: 5

      # N=100 -> 10000 petak, uji kinerja BFS pada papan besar
      - name: Case 12 - Papan besar 100x100 tanpa tangga & naga (jawab 1667)
        id: case-12
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Case 12 - Papan besar 100x100 tanpa tangga & naga (jawab 1667)
          setup-command: gcc -std=c11 -O2 -Wall -Wextra -o soal1 soal1.c
          command: ./soal1
          input: |
            100
            0
            0
          expected-output: |
            1667
          comparison-method: exact
          timeout: 2
          max-score: 5

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          CASE-01_RESULTS: "${{steps.case-01.outputs.result}}"
          CASE-02_RESULTS: "${{steps.case-02.outputs.result}}"
          CASE-03_RESULTS: "${{steps.case-03.outputs.result}}"
          CASE-04_RESULTS: "${{steps.case-04.outputs.result}}"
          CASE-05_RESULTS: "${{steps.case-05.outputs.result}}"
          CASE-06_RESULTS: "${{steps.case-06.outputs.result}}"
          CASE-07_RESULTS: "${{steps.case-07.outputs.result}}"
          CASE-08_RESULTS: "${{steps.case-08.outputs.result}}"
          CASE-09_RESULTS: "${{steps.case-09.outputs.result}}"
          CASE-10_RESULTS: "${{steps.case-10.outputs.result}}"
          CASE-11_RESULTS: "${{steps.case-11.outputs.result}}"
          CASE-12_RESULTS: "${{steps.case-12.outputs.result}}"
        with:
          runners: case-01,case-02,case-03,case-04,case-05,case-06,case-07,case-08,case-09,case-10,case-11,case-12
